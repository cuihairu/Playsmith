name: ci

on:
  push:
    branches: [main]
    paths:
      - '**.go'
      - 'go.mod'
      - 'go.sum'
      - 'Makefile'
      - 'proto/**'
      - 'internal/**'
      - 'cmd/**'
      - 'chaincode/**'
      - '.github/workflows/ci.yml'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-go@v6.1.0
        with:
          go-version: '1.26'
          cache: false
      # build and test both depend on proto-check, which pins protoc exactly
      # (Makefile PROTOC_VERSION). protoc 3.21.12 has no GitHub release asset, so it
      # comes from apt rather than a download. proto-doctor fails loudly if the apt
      # package ever drifts from the pinned version.
      - name: Install protoc
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler
      - name: Verify toolchain
        run: make proto-doctor
      - name: Install protoc plugins
        run: make proto-install
      - name: Build
        run: make build
      - name: Vet
        run: make vet
      - name: Test
        run: make test
