name: ci

on:
  push:
    branches: [main]
    paths:
      - '**.go'
      - 'go.mod'
      - 'go.sum'
      - 'Makefile'
      - 'proto/**'
      - 'internal/**'
      - 'cmd/**'
      - 'chaincode/**'
      - '.github/workflows/ci.yml'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-go@v6.1.0
        with:
          go-version: '1.26'
          cache: false
      # build and test both depend on proto-check, which pins protoc exactly.
      # The pinned generation plugins are installed by make proto-install, so a
      # plain protoc alone is not enough.
      - name: Install protoc
        run: |
          mkdir -p tools/bin
          curl -fsSL -o protoc.zip https://github.com/protocolbuffers/protobuf/releases/download/v3.21.12/protoc-3.21.12-linux-x86_64.zip
          unzip -q protoc.zip -d tools/bin
      - name: Verify toolchain
        env:
          PATH: "${{ github.workspace }}/tools/bin:${{ env.GOPATH }}/bin:$PATH"
        run: make proto-doctor
      - name: Install protoc plugins
        run: make proto-install
        env:
          PATH: "${{ github.workspace }}/tools/bin:$PATH"
      - name: Build
        run: make build
        env:
          PATH: "${{ github.workspace }}/tools/bin:${{ env.GOPATH }}/bin:$PATH"
      - name: Vet
        run: make vet
        env:
          PATH: "${{ github.workspace }}/tools/bin:${{ env.GOPATH }}/bin:$PATH"
      - name: Test
        run: make test
        env:
          PATH: "${{ github.workspace }}/tools/bin:${{ env.GOPATH }}/bin:$PATH"
